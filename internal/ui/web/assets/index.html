<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostveil</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Generated from internal/ui/theme: the palettes, then the layout that
       draws from them. theme.js is blocking and in <head> on purpose — it
       restores the saved theme before the first paint, and the page's CSP
       (default-src 'self') rules out doing that inline. -->
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <!-- Generated from internal/model: domains, severities, remediation
       kinds, scan states, score bands. Blocking, because app.js reads the
       tables while rendering its first frame. -->
  <script src="/model.js"></script>
</head>
<body>
  <!-- The rail is a sibling of everything else, not a child of it, so it
       runs the full height of the window beside .stack. -->
  <aside class="rail" id="rail"></aside>

  <div class="stack">
    <div class="statusbar">
      <div class="brand"><b>Hostveil</b></div>
      <div class="gauge" id="gauge"></div>
      <div class="actions">
        <select id="theme" aria-label="Color theme"></select>
        <button id="export">Export</button>
        <button id="advise">Advise</button>
        <button id="history">History</button>
        <button id="rescan">Rescan</button>
        <button id="fixall" class="primary">Fix all safe</button>
      </div>
    </div>

    <div class="axes" id="axes"></div>
    <div class="delta" id="delta" hidden></div>
    <div class="delta" id="trend" hidden></div>
    <div class="domains" id="domains" hidden></div>
    <div class="status" id="status" hidden></div>

    <main>
      <section class="findings">
        <div class="pane-head" id="findings-title">
          <span id="findings-title-text">Findings</span>
          <select id="sort" aria-label="Sort findings">
            <option value="severity">Sort: Severity</option>
            <option value="domain">Sort: Domain</option>
            <option value="remediation">Sort: Remediation</option>
          </select>
        </div>
        <div class="filterbar" id="filterbar"></div>
        <div class="batchbar" id="batchbar" hidden></div>
        <ul id="findings"></ul>
      </section>
      <section class="detail" id="detail">
        <p class="empty">Reading the scan…</p>
      </section>
    </main>
  </div>

  <!-- One mount point for every modal the dashboard shows: export format,
       a fix's outcome, and a batch's per-item progress. openModal()/
       closeModal() in app.js are the whole interface to it. -->
  <dialog id="modal"><div class="modal-body" id="modal-body"></div></dialog>

  <script src="/app.js"></script>
</body>
</html>
