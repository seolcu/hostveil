name: E2E

# Drives the real binary through the sequence that changes a host —
# scan → fix → rescan → rollback → rescan — and checks the outcome at each
# step, against a container seeded with genuine misconfigurations.
#
# Everything above this is a unit test against a fake CommandRunner, which
# proves the checkers parse what they are handed but never that hostveil
# reads a real sshd_config, writes it, and puts it back. The project had
# browser E2E in v2 and deleted it in the v3 rewrite; nothing replaced it,
# and the demo VM is manual and asserts nothing. This is the smallest thing
# that closes the gap and runs on every pull request.
#
# Deliberately no Docker and no Trivy: the container domains need a daemon,
# and the point here is the apply/rollback machinery, not coverage breadth.
# The domains that cannot run report Skipped, which is itself asserted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A container is built and driven through scan → fix → rollback here, and
    # a change to prose cannot alter what that does. Not a required check, so
    # skipping it leaves nothing pending.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "cmd/sitegen/content/**"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    # Debian, not the runner itself: the test writes /etc/ssh/sshd_config and
    # chmods files under /etc, and doing that to the runner would be both
    # rude and unrepeatable. A container gives a disposable root filesystem.
    container:
      image: debian:13
    steps:
      - name: Install the host tooling hostveil probes for
        run: |
          apt-get update -qq
          # openssh-server for sshd and its -t validator; iproute2 for `ss`;
          # git because actions/checkout needs it inside a container.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openssh-server iproute2 ca-certificates git jq >/dev/null

      - uses: actions/checkout@v7

      # The checkout is owned by a different uid than the one running inside
      # the container, so git refuses it as "dubious ownership" — which
      # surfaces as `go build` failing with "error obtaining VCS status"
      # rather than as anything about git.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build
        run: go build -o /usr/local/bin/hostveil ./cmd/hostveil

      - name: Seed the host with real misconfigurations
        run: |
          set -eux
          mkdir -p /etc/ssh/sshd_config.d
          # The same fixture the demo VM uses, so the two describe one host.
          cp demo/seed/sshd_hostveil.conf /etc/ssh/sshd_config.d/00-hostveil-demo.conf
          # sshd -t needs a host key to validate against, and hostveil's SSH
          # fixes run that validator before writing.
          ssh-keygen -A
          sshd -t

      - name: scan finds the seeded problems and gates on them
        run: |
          set -eux
          # Already root in the container, so elevation is neither needed nor
          # possible; the opt-out keeps it from trying.
          export HOSTVEIL_NO_SUDO=1

          set +e
          hostveil scan --json > /tmp/scan1.json
          code=$?
          set -e
          # 1 means unfixed Critical or High findings, which is the whole
          # point of the seed. 0 would mean the scan found nothing; 3 would
          # mean a domain failed outright.
          test "$code" = 1

          for id in ssh.rootlogin ssh.passwordauth ssh.emptypasswords; do
            grep -q "\"$id\"" /tmp/scan1.json || { echo "missing $id"; exit 1; }
          done

      - name: fix --all applies the safe fixes and the score improves
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1

          before=$(hostveil scan --json | jq '.score.overall')

          hostveil fix --all --yes

          after=$(hostveil scan --json | jq '.score.overall')
          echo "score $before -> $after"
          test "$after" -gt "$before"

          # The Auto SSH fixes are edits, so they must have taken effect on
          # the real file — and sshd must still accept the result, which is
          # what the fix's own validator promised.
          grep -q "PermitEmptyPasswords no" /etc/ssh/sshd_config.d/00-hostveil-demo.conf
          sshd -t

      - name: fix --all leaves the fixes that run commands alone
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1

          # Enabling automatic security updates is a real remediation that
          # hostveil knows how to apply, and it runs a command — so it leaves
          # no restore point, and "fix everything safe" has to decline it.
          # The package must still be absent and the finding must still be
          # open after the batch above.
          #
          # Unit tests pin the classification against a fake registry. This is
          # the only place it meets a real apt, on a host where the finding
          # genuinely fires, with a real `fix --all` deciding what to run.
          # Written as an if rather than `! dpkg …`: a negated command is
          # exempt from errexit, so the assertion would report nothing however
          # it turned out.
          if dpkg -s unattended-upgrades >/dev/null 2>&1; then
            echo "fix --all installed unattended-upgrades: a fix that runs commands was applied unattended"
            exit 1
          fi

          hostveil scan --json > /tmp/scan_fixed.json || true
          test "$(jq '[.findings[] | select(.id == "updates.disabled")] | length' /tmp/scan_fixed.json)" = 1

      - name: history lists the applied fixes and rollback restores them
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1

          hostveil history | tee /tmp/history.txt
          grep -q "rollback: hostveil rollback " /tmp/history.txt

          # Roll back every checkpoint, newest first, which is the order
          # history prints and the only order that is safe: two fixes to one
          # file leave the second's content in place.
          # rollback does not prompt, so there is nothing to confirm.
          grep -o 'hostveil rollback [^] ]*' /tmp/history.txt | while read -r _ _ id; do
            hostveil rollback "$id"
          done

          # Back to the seeded state: the finding that was fixed is back.
          grep -q "PermitEmptyPasswords yes" /etc/ssh/sshd_config.d/00-hostveil-demo.conf
          sshd -t

      - name: a rescan sees the restored problems again
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          set +e
          hostveil scan --json > /tmp/scan2.json
          code=$?
          set -e
          test "$code" = 1
          grep -q '"ssh.emptypasswords"' /tmp/scan2.json

      - name: rollback declines to clobber an edit made after the fix
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          conf=/etc/ssh/sshd_config.d/00-hostveil-demo.conf

          hostveil fix --all --yes
          hostveil history > /tmp/history2.txt
          id=$(grep -o 'hostveil rollback [^] ]*' /tmp/history2.txt | head -1 | awk '{print $3}')

          # The operator edits the file themselves, after hostveil wrote it.
          echo "# edited by the operator after the fix" >> "$conf"
          before=$(sha256sum "$conf" | cut -d' ' -f1)

          # Rollback keeps no backup of its own, so overwriting those edits
          # would be unrecoverable. It has to refuse and leave the file exactly
          # as it found it — a refusal that still wrote would be the worst
          # outcome this layer can produce.
          set +e
          hostveil rollback "$id" > /tmp/declined.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q -- "--force" /tmp/declined.txt
          test "$(sha256sum "$conf" | cut -d' ' -f1)" = "$before"

          # And --force has to be a real escape hatch rather than a sentence
          # in an error message: it restores the backup, edits and all.
          hostveil rollback "$id" --force
          if grep -q "edited by the operator after the fix" "$conf"; then
            echo "--force did not restore the backup: the operator's edit is still there"
            exit 1
          fi
          sshd -t

      - name: domains that cannot run report Skipped, never clean
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          # No Docker daemon and no Trivy here. The invariant is that those
          # domains are excluded rather than awarded a perfect score, so a
          # scan that could not look never reads as a scan that found nothing.
          # scan exits 1 whenever unfixed Critical/High findings exist,
          # which is exactly the state under test — so the status here is
          # expected, not a failure.
          hostveil scan --json > /tmp/scan3.json || true

          # Nothing below is worth anything if the selection matches no
          # domain, so the count is asserted first. ScanState marshals as its
          # name, and this step used to select on the ordinal instead: once
          # #656 changed the encoding that matched nothing, `bad` was empty
          # however the scan turned out, and a step named for the invariant
          # went on passing without ever testing it. There is no Docker and no
          # Trivy here, so at least one domain is always Skipped — if none is,
          # the report changed shape and this step is looking at the wrong
          # thing. internal/docs/e2e_test.go pins the literal below against
          # what the model actually writes.
          skipped=$(jq '[.domains[] | select(.state == "skipped")] | length' /tmp/scan3.json)
          test "$skipped" -gt 0 || {
            echo "no domain reported Skipped, so this step asserts nothing"; exit 1; }

          # Every domain reported Skipped must have a non-applicable axis. A
          # skipped domain scored 100 is the failure this whole invariant
          # exists to prevent, and it is invisible in the printed report.
          bad=$(jq -r '
            (.score.axes | map({key: (.source|tostring), value: .}) | from_entries) as $ax
            | .domains[] | select(.state == "skipped")
            | select($ax[(.source|tostring)].applicable)
            | .source' /tmp/scan3.json)
          test -z "$bad" || { echo "skipped domains still scored: $bad"; exit 1; }

          # Some domains did run here, so the overall score means something.
          test "$(jq '.score.applicable' /tmp/scan3.json)" = true

      - name: the debug trace works and never leaks command output
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          HOSTVEIL_DEBUG=1 hostveil scan >/dev/null 2>/tmp/trace.txt || true
          grep -q 'hostveil\[trace\]' /tmp/trace.txt
          # stdout must be unaffected by the trace.
          HOSTVEIL_DEBUG=1 hostveil scan --json 2>/dev/null | jq -e . >/dev/null

      # update and uninstall are the two commands that rewrite the installed
      # binary and delete files, and they had no integration coverage at all —
      # 57% and 44% in unit tests, which is the furthest a unit test gets from
      # the thing being tested when the thing is "does it really remove the
      # file".
      #
      # Last, because the second half deletes the binary every step above
      # depends on.
      - name: update and uninstall refuse a binary they did not install
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          # The build above put it in /usr/local/bin, which is not where any
          # install path this program knows about puts it. Refusing there is
          # the documented promise: guessing means overwriting a file some
          # other tool believes it owns.
          test -x /usr/local/bin/hostveil
          hostveil uninstall --yes >/tmp/un.txt 2>&1 && exit 1
          grep -qi 'could not tell how this binary was installed' /tmp/un.txt
          test -x /usr/local/bin/hostveil   # and it is still there

      - name: uninstall removes the binary and keeps the checkpoints
        run: |
          set -eux
          export HOSTVEIL_NO_SUDO=1
          # Where the install script puts it, which is the origin hostveil
          # recognises without asking a package manager.
          cp /usr/local/bin/hostveil /usr/bin/hostveil
          hostveil scan >/dev/null 2>&1 || true
          test -d /var/lib/hostveil

          /usr/bin/hostveil uninstall --yes >/tmp/un2.txt 2>&1
          test ! -e /usr/bin/hostveil

          # The promise the docs make, and the reason uninstalling is not a
          # decision to give up the ability to undo the fixes: the state
          # directory survives, and the command to remove it is printed rather
          # than run.
          test -d /var/lib/hostveil
          grep -q '/var/lib/hostveil' /tmp/un2.txt
