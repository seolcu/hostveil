name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow can run this exact gate against the
  # commit being tagged, rather than trusting that some earlier run of it
  # passed. Adding this does not change when CI runs on its own.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # The release workflow calls this one, and a broken `uses:` path or a
      # dangling `needs:` in that wiring is invisible until a tag is pushed —
      # by which time the thing that was supposed to gate the release is the
      # thing that is broken. actionlint catches both statically. Pinned for
      # the same reason golangci-lint is: a floating version can start
      # failing CI on a commit that changed nothing.
      #
      # Runs from the repo root with no arguments, which lints every file
      # under .github/workflows. The runner has shellcheck installed, so this
      # also checks the shell in every `run:` block.
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # A tool that reports other people's vulnerabilities should not ship
      # its own. govulncheck reports only vulnerabilities in code paths this
      # binary actually reaches, so a finding here is real rather than a
      # dependency-graph coincidence — which is why it gates the build
      # instead of merely warning.
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Verify site/ is up to date with sitegen
        run: |
          go run ./cmd/sitegen
          changes=$(git status --porcelain site/)
          if [ -n "$changes" ]; then
            echo "site/ is out of date (modified, added, or removed files):"
            echo "$changes"
            echo "Run 'go run ./cmd/sitegen' and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Verify install.sh checksum is up to date
        run: |
          cd scripts && sha256sum -c install.sh.sha256

      # goreleaser builds linux and darwin on amd64 and arm64, and until this
      # existed the first compile of three of those four targets happened
      # during a release — where a failure demotes the release to a draft
      # rather than being caught on the pull request that caused it.
      # Compiling is enough: the tests only pass meaningfully on the platform
      # they run on, and a build break is what actually escapes review.
      - name: Cross-compile every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      # shellcheck over install.sh, which nothing covered. actionlint checks
      # the shell inside `run:` blocks in workflows, not standalone scripts —
      # and this is 10 KB of privileged bash that pipes into sudo on machines
      # hostveil has never seen. The runner ships shellcheck.
      - name: Lint install.sh
        run: shellcheck scripts/install.sh

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # Reported, not gated. A threshold on a repository this size mostly
      # teaches people to write tests that move the number, and the useful
      # signal is which package dropped — which is visible right here in the
      # job summary next to the diff that caused it.
      - name: Coverage by package
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo "### Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
