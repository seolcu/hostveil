name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow can run this exact gate against the
  # commit being tagged, rather than trusting that some earlier run of it
  # passed. Adding this does not change when CI runs on its own.
  workflow_call:

# One run per pull request at a time: pushing twice in a minute used to leave
# both runs queued for a runner, and the answer everyone waits for is the one
# for the newest commit. Cancelling is scoped to pull requests — a push to
# main and the release workflow's call of this gate must never be cancelled by
# anything, least of all by each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The gate takes about two minutes. Ten is not a target, it is the point
    # past which the job is stuck rather than slow, and a stuck job holds the
    # pull request until somebody notices.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # check-latest, because without it `go-version: "1.26"` means
          # "whatever 1.26.x this runner image happens to have cached", not
          # "the newest 1.26.x". The image sat on 1.26.5 after 1.26.6 shipped
          # and govulncheck failed the build on five standard-library
          # vulnerabilities that were already fixed upstream. A version spec
          # that reads as a range has to behave like one.
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # The release workflow calls this one, and a broken `uses:` path or a
      # dangling `needs:` in that wiring is invisible until a tag is pushed —
      # by which time the thing that was supposed to gate the release is the
      # thing that is broken. actionlint catches both statically. Pinned for
      # the same reason golangci-lint is: a floating version can start
      # failing CI on a commit that changed nothing.
      #
      # Runs from the repo root with no arguments, which lints every file
      # under .github/workflows. The runner has shellcheck installed, so this
      # also checks the shell in every `run:` block.
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # A tool that reports other people's vulnerabilities should not ship
      # its own. govulncheck reports only vulnerabilities in code paths this
      # binary actually reaches, so a finding here is real rather than a
      # dependency-graph coincidence — which is why it gates the build
      # instead of merely warning.
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Verify site/ is up to date with sitegen
        run: |
          go run ./cmd/sitegen
          changes=$(git status --porcelain site/)
          if [ -n "$changes" ]; then
            echo "site/ is out of date (modified, added, or removed files):"
            echo "$changes"
            echo "Run 'go run ./cmd/sitegen' and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Verify install.sh checksum is up to date
        run: |
          cd scripts && sha256sum -c install.sh.sha256

      # The cross-compile below covers what goreleaser *builds*; this covers
      # what it is *told* to build. Archives, checksums, SBOM hooks and the
      # ldflags that stamp the version live in .goreleaser.yaml, and nothing
      # reads that file until a tag exists — by which time the release has
      # already been published, because a maintainer creates it to make the
      # tag. A config error there therefore surfaces as a live release with no
      # artifacts, which is the situation demote-on-failure exists to clean up
      # after. `check` is a parse and validate, so it costs seconds and needs
      # no token.
      - name: Validate the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          args: check

      # goreleaser builds linux and darwin on amd64 and arm64, and until this
      # existed the first compile of three of those four targets happened
      # during a release — where a failure demotes the release to a draft
      # rather than being caught on the pull request that caused it.
      # Compiling is enough: the tests only pass meaningfully on the platform
      # they run on, and a build break is what actually escapes review.
      # Concurrently, and without linux/amd64: the Build step above is that
      # target, so compiling it again is a third of this step spent proving
      # something already proved. The remaining three are independent, and
      # sequentially they were the second-slowest step in the gate.
      - name: Cross-compile every other release target
        run: |
          pids=""
          for target in linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done

      # shellcheck over the standalone scripts, which nothing covered.
      # actionlint checks the shell inside `run:` blocks in workflows, not
      # scripts on disk. install.sh is 10 KB of privileged bash that pipes into
      # sudo on machines hostveil has never seen; seed.sh permits root SSH
      # login and adds a second UID 0 account, and is published beside an
      # invitation to run it. The runner ships shellcheck.
      #
      # Every script, found rather than listed. The list used to name those
      # two, and the eleven it left out were no less privileged: measure/run.sh
      # is root and edits the host it measures, and instruments/rollback.sh
      # computes the rollback-fidelity claim check.py fails the run over. All
      # of them were already clean, so naming two was costing coverage and
      # buying nothing — and a hand-kept list is how the next script joins the
      # repo unchecked.
      - name: Lint shell scripts
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # The same suite in the other width mode, which is the one hostveil's
      # own audience is most likely to be in.
      #
      # RUNEWIDTH_EASTASIAN=1 is an operator saying their terminal draws the
      # East Asian Ambiguous class two columns wide, and hostveil honours it —
      # internal/textwidth explains why it must, and lipgloss reads the same
      # variable. Every glyph the frame and the meters are drawn from is in
      # that class, so the whole layout is a different arithmetic there, and
      # nothing ever ran it: the meters were built by rune count and every
      # strip on the screen composed past the edge of the terminal, through
      # every release that has had a meter in it.
      #
      # Only the packages that lay anything out, and without -race: this is a
      # second pass over the same code for a different environment, not a
      # second search for data races.
      - name: Test in a double-width terminal
        env:
          RUNEWIDTH_EASTASIAN: "1"
        run: go test -count=1 ./internal/ui/... ./internal/textwidth/ ./internal/clirender/ ./internal/glyph/ ./internal/model/

      # Reported, not gated. A threshold on a repository this size mostly
      # teaches people to write tests that move the number, and the useful
      # signal is which package dropped — which is visible right here in the
      # job summary next to the diff that caused it.
      - name: Coverage by package
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo "### Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
