# A database admin panel, opened up once to look at a table from a laptop.
services:
  adminer:
    image: homelab/adminer:5
    build:
      context: .
      dockerfile: adminer.Dockerfile
    user: adminer
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
