# A Git server and its database.
services:
  gitea:
    image: homelab/gitea:28.4
    build:
      context: .
      dockerfile: gitea.Dockerfile
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${DB_PASSWORD}
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - db

  db:
    image: homelab/postgres:17
    build:
      context: .
      dockerfile: db.Dockerfile
    user: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gitea-data:
  gitea-config:
  db-data:
