# A small web app and its database.
services:
  web:
    image: homelab/web:1.31
    build:
      context: .
      dockerfile: web.Dockerfile
    user: "101:101"
    ports:
      - "8088:8080"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - db

  db:
    image: homelab/postgres:17
    build:
      context: .
      dockerfile: db.Dockerfile
    user: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
