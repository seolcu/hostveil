# SSH settings a self-hoster leaves behind while getting a box to work.
#
# provision.sh installs this as /etc/ssh/sshd_config.d/00-hostveil-demo.conf.
# The 00- prefix matters: sshd expands Include in sorted order and keeps the
# first value it obtains for each keyword, so this has to sort ahead of the
# cloud image's own drop-ins (50-cloud-init.conf, 60-cloudimg-settings.conf).
#
# Weak, and fixed by `hostveil fix --all`:
#   ssh.rootlogin (Auto here: root's password is locked on the cloud image),
#   ssh.emptypasswords, ssh.x11forwarding, ssh.maxauthtries, and the
#   keepalive, grace-time and log-level defaults the image leaves unset.
PermitRootLogin yes
PermitEmptyPasswords yes
X11Forwarding yes
MaxAuthTries 10

# Already sound, so the demo has no Review-only SSH finding: passwords are
# off, agent forwarding is off, and one connection opens at most two
# sessions. TCP forwarding stays on, because `ssh homelab` tunnels the
# dashboard through it (ssh.allowtcpforwarding is the one SSH finding left).
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowAgentForwarding no
MaxSessions 2
