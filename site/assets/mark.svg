<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="hostveil">
  <!-- The hostveil mark: the host drawn as the thing it physically is. Twelve
       pins, a package, the pin-1 orientation notch, and a hardened core with
       the die at its centre. Safe green is the core because green means one
       thing in this design system — the part that has been made safe — and
       everything else is Bone.

       This variant carries no tile, so it dissolves into whatever palette
       paints the surface behind it; favicon.svg keeps one because a browser
       tab is requested before any theme is known. The two are one drawing,
       and site/assets/ carries byte-identical copies for the marketing site,
       held there by TestSiteBrandAssetsMatchTheDashboard — four hand-drawn
       marks is what this replaced.

       The weights are set for 16-20px rather than scaled down from the large
       size: 3-unit pins and a 2.8 package stroke are heavier than the drawing
       wants at 48, and are the only reason it survives in a tab. -->
  <g fill="#c8ccd4">
    <rect x="3.4" y="13.2" width="6.6" height="3"/>
    <rect x="3.4" y="22.5" width="6.6" height="3"/>
    <rect x="3.4" y="31.8" width="6.6" height="3"/>
    <rect x="38" y="13.2" width="6.6" height="3"/>
    <rect x="38" y="22.5" width="6.6" height="3"/>
    <rect x="38" y="31.8" width="6.6" height="3"/>
    <rect x="13.2" y="3.4" width="3" height="6.6"/>
    <rect x="22.5" y="3.4" width="3" height="6.6"/>
    <rect x="31.8" y="3.4" width="3" height="6.6"/>
    <rect x="13.2" y="38" width="3" height="6.6"/>
    <rect x="22.5" y="38" width="3" height="6.6"/>
    <rect x="31.8" y="38" width="3" height="6.6"/>
  </g>
  <rect x="9.6" y="9.6" width="28.8" height="28.8" rx="2.4"
        fill="none" stroke="#c8ccd4" stroke-width="2.8"/>
  <circle cx="14.8" cy="14.8" r="1.8" fill="#c8ccd4"/>
  <rect x="17.4" y="17.4" width="13.2" height="13.2" fill="#98c379"/>
  <rect x="21.7" y="21.7" width="4.6" height="4.6" fill="#c8ccd4"/>
</svg>
