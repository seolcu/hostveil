<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="hostveil">
  <!-- The hostveil mark: a veil. The host is the sheet behind, drawn in Bone;
       the sheet laid over it is the hardening, drawn in Safe, because green
       means one thing in this design system — the part that has been made
       safe. The front sheet is not outlined; the back one is cut away around
       it instead, so the gap between them is a real hole and the figure
       reads on any ground without knowing what colour that ground is.

       This variant carries no tile, so it dissolves into whatever palette
       paints the surface behind it; favicon.svg keeps one because a browser
       tab is requested before any theme is known. The two are one drawing,
       and site/assets/ carries byte-identical copies for the marketing site,
       held there by TestSiteBrandAssetsMatchTheDashboard. The site's light
       scheme uses site/assets/mark-light.svg, the same geometry in the light
       palette's ink, held to this file by TestLightMarkIsTheSameDrawing.

       The three-unit gap is one pixel at 16px, which is the smallest size the
       mark is drawn at and the reason it is not thinner. -->
  <mask id="hv-cut">
    <rect width="48" height="48" fill="white"/>
    <rect x="14" y="14" width="32" height="32" rx="11" fill="black"/>
  </mask>
  <rect x="5" y="5" width="26" height="26" rx="8" fill="#f5f5f7" mask="url(#hv-cut)"/>
  <rect x="17" y="17" width="26" height="26" rx="8" fill="#3ccf7e"/>
</svg>
