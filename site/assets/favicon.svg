<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="hostveil">
  <!-- The tab icon: the same drawing as mark.svg, on an opaque Ink2 tile.
       A browser asks for a favicon before any theme is known, so this one
       cannot dissolve into the surface behind it the way the status-bar mark
       does — it brings its own ground. Bone #f5f5f7, Safe #3ccf7e, Ink2
       #0b0b0c, all three the default palette's own roles.

       The drawing is inset to 76%, so it sits on the tile as on a plate
       rather than running into the tile's corners. -->
  <mask id="hv-cut">
    <rect width="48" height="48" fill="white"/>
    <rect x="14" y="14" width="32" height="32" rx="11" fill="black"/>
  </mask>
  <rect width="48" height="48" rx="11" fill="#0b0b0c"/>
  <g transform="translate(5.76 5.76) scale(0.76)">
    <rect x="5" y="5" width="26" height="26" rx="8" fill="#f5f5f7" mask="url(#hv-cut)"/>
    <rect x="17" y="17" width="26" height="26" rx="8" fill="#3ccf7e"/>
  </g>
</svg>
